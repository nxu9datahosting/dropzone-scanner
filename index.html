
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Inbound Receive</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: 'Noto Sans', Arial, sans-serif;
      background: #1a1a2e;
      color: #fff;
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 12px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .header h1 {
      font-size: 1.2rem;
      color: #e0e0e0;
      margin-left: 10%;
    }

    .logo-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .logo-btn img {
      width: 88px;
      height: 88px;
    }

    .screen { display: none; flex-direction: column; flex: 1; }
    .screen.active { display: flex; }

    .home-screen {
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .home-btn {
      width: 80%;
      padding: 24px;
      font-size: 1.3rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      color: #fff;
      cursor: pointer;
      text-align: center;
    }

    .home-btn.receive { background: #1b9c5a; }
    .home-btn.receive:active { background: #22b86b; }
    .home-btn.dropzone { background: #0f3460; }
    .home-btn.dropzone:active { background: #1a4a7a; }

    .login-screen {
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    .login-screen p {
      color: #fff;
      font-size: 0.9rem;
      text-align: center;
    }

    .scan-field {
      width: 80%;
      font-size: 1.3rem;
      padding: 14px;
      border: 3px solid #0f3460;
      border-radius: 8px;
      background: #16213e;
      color: #fff;
      text-align: center;
      font-family: 'Noto Sans', Arial, sans-serif;
    }

    .badge-img {
      width: 100px;
      height: auto;
      margin-bottom: 8px;
    }

    .login-error {
      color: #e94560;
      font-size: 0.85rem;
      font-weight: bold;
      min-height: 1.2em;
    }

    .mode-label {
      font-size: 1rem;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    .mode-label.receive { background: #1b9c5a; }
    .mode-label.dropzone { background: #0f3460; }

    .trailer-screen {
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    .trailer-screen p {
      color: #fff;
      font-size: 0.9rem;
      text-align: center;
    }

    .trailer-error {
      color: #e94560;
      font-size: 0.85rem;
      font-weight: bold;
      min-height: 1.2em;
    }

    .scan-input-hidden {
      position: absolute;
      left: -9999px;
      opacity: 0;
    }

    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #16213e;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 0.85rem;
    }

    .user-bar .name { color: #1b9c5a; font-weight: bold; }
    .user-bar .trailer-id { color: #f58840; font-weight: bold; }

    .step-indicator {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .step {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      background: #16213e;
      color: #555;
    }

    .step.active { background: #0f3460; color: #fff; }
    .step.active-receive { background: #1b9c5a; color: #fff; }
    .step.done { background: #1b9c5a; color: #fff; }

    .scan-prompt {
      flex: 0 0 auto;
      text-align: center;
      padding: 20px;
      margin-bottom: 10px;
    }

    .scan-prompt .icon { font-size: 2.5rem; margin-bottom: 8px; }

    .scan-prompt .instruction {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .scan-prompt .detail { font-size: 0.9rem; color: #888; }

    .scan-prompt .captured {
      font-size: 1.1rem;
      color: #1b9c5a;
      font-family: monospace;
      margin-top: 8px;
    }

    .status {
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      transition: background 0.2s;
    }

    .status.ready   { background: #0f3460; }
    .status.success { background: #1b9c5a; }
    .status.error   { background: #e94560; }
    .status.offline { background: #f58840; }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .log-header h2 { font-size: 0.9rem; color: #aaa; }

    .scan-count {
      background: #0f3460;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
    }

    .log {
      flex: 1;
      overflow-y: auto;
      background: #16213e;
      border-radius: 8px;
      padding: 8px;
    }

    .log-entry {
      display: flex;
      justify-content: space-between;
      padding: 6px 8px;
      border-bottom: 1px solid #1a1a2e;
      font-size: 0.8rem;
    }

    .log-entry .barcode { font-family: monospace; }
    .log-entry .time    { color: #888; }
    .log-entry.pending  { color: #f58840; }
    .log-entry.sent     { color: #1b9c5a; }
    .log-entry.failed   { color: #e94560; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Inbound Receive</h1>
    <button class="logo-btn" onclick="goHome()" title="Home">
      <img src="images/nxu9.png" alt="NXU9">
    </button>
  </div>

  <div class="screen home-screen active" id="homeScreen">
    <button class="home-btn receive" onclick="startMode('receive')">📥 Receive</button>
    <button class="home-btn dropzone" onclick="startMode('dropzone')">📍 Dropzone</button>
  </div>

  <div class="screen login-screen" id="loginScreen">
    <div class="mode-label" id="loginModeLabel"></div>
    <img src="images/badge.png" alt="Scan Badge" class="badge-img">
    <p>Scan your badge</p>
    <input type="text" class="scan-field" id="badgeInput" placeholder="Scan badge..."
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <div class="login-error" id="loginError"></div>
  </div>

  <div class="screen trailer-screen" id="trailerScreen">
    <div class="mode-label receive">📥 Receive</div>
    <img src="images/truck.png" alt="Scan Trailer" class="badge-img">
    <p>Scan the Transhipment ID</p>
    <input type="text" class="scan-field" id="trailerInput" placeholder="Scan trailer..."
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <div class="trailer-error" id="trailerError"></div>
  </div>

  <div class="screen" id="scannerScreen">

    <div class="user-bar">
      <div>
        <span>User: <span class="name" id="userName"></span></span>
        <span id="trailerDisplay"></span>
      </div>
    </div>

    <div class="step-indicator" id="stepIndicator">
      <div class="step" id="stepPallet">1. Scan Pallet</div>
      <div class="step" id="stepDropzone">2. Scan Dropzone</div>
    </div>

    <div class="scan-prompt" id="scanPrompt">
      <div class="icon" id="promptIcon">📦</div>
      <div class="instruction" id="promptText">Scan a pallet</div>
      <div class="detail" id="promptDetail"></div>
      <div class="captured" id="promptCaptured"></div>
    </div>

    <input type="text" class="scan-input-hidden" id="scanInput"
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

    <div class="status ready" id="status">Ready to scan</div>

    <div class="log-header">
      <h2>Recent Scans</h2>
      <span class="scan-count" id="scanCount">0 scans</span>
    </div>
    <div class="log" id="log"></div>
  </div>

  <script>
    var API_URL = 'https://96a2e921c35de1afbc46731313c6a0.05.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/25/workflows/909703d3b84546168fdd241a2442692f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=xNbDYhH_H6KKuStrvucP-jMYK9xmJm69t6qvUzolmMw';
    var OFFLINE_KEY = 'dropzone_offline_queue';
    var VALID_DROPZONES = ['LIFT', 'CHILLER', 'FREEZER', 'HRV'];

    // ── ROSTER LOOKUP ──
    var roster = {};

    fetch('data/roster.csv')
      .then(function(r) {
        if (!r.ok) throw new Error('Not found');
        return r.text();
      })
      .then(function(text) {
        var lines = text.trim().split('\n');
        for (var i = 1; i < lines.length; i++) {
          var parts = lines[i].split(',');
          if (parts.length >= 2) {
            var alias = parts[0].trim();
            var badge = parts[1].trim();
            roster[badge] = alias;
          }
        }
        console.log('Roster loaded: ' + Object.keys(roster).length + ' employees');
      })
      .catch(function() {
        console.log('No roster found — will display badge numbers');
      });

    function lookupAlias(badge) {
      return roster[badge] || badge;
    }

    var currentMode = '';
    var currentUser = '';
    var currentUserDisplay = '';
    var currentPallet = '';
    var currentTrailer = '';
    var scanCount = 0;
    var scanStep = 'pallet';

    var badgeInput     = document.getElementById('badgeInput');
    var loginError     = document.getElementById('loginError');
    var trailerInput   = document.getElementById('trailerInput');
    var trailerError   = document.getElementById('trailerError');
    var scanInput      = document.getElementById('scanInput');
    var statusEl       = document.getElementById('status');
    var logEl          = document.getElementById('log');
    var scanCountEl    = document.getElementById('scanCount');
    var promptIcon     = document.getElementById('promptIcon');
    var promptText     = document.getElementById('promptText');
    var promptDetail   = document.getElementById('promptDetail');
    var promptCaptured = document.getElementById('promptCaptured');
    var stepPallet     = document.getElementById('stepPallet');
    var stepDropzone   = document.getElementById('stepDropzone');

    // Prevent all scrolling except the log
    document.addEventListener('touchmove', function(e) {
      if (!e.target.closest('.log')) {
        e.preventDefault();
      }
    }, { passive: false });

    function isValidBadge(value) {
      return /^\d+$/.test(value);
    }

    function isDropzone(value) {
      return VALID_DROPZONES.indexOf(value) !== -1;
    }

    function isValidPallet(value) {
      return value.length >= 11 && !isDropzone(value);
    }

    function showScreen(id) {
      var screens = document.querySelectorAll('.screen');
      for (var i = 0; i < screens.length; i++) {
        screens[i].classList.remove('active');
      }
      document.getElementById(id).classList.add('active');
    }

    // ── KEYBOARD DISMISS TRICK ──
    // Focus → blur → re-focus dismisses the keyboard on most Android devices
    // but keeps the input as the active target for the hardware scanner
    function smartFocus(input) {
      input.focus();
      setTimeout(function() {
        input.blur();
        setTimeout(function() {
          input.focus();
        }, 50);
      }, 50);
    }

    function startMode(mode) {
      currentMode = mode;
      var label = document.getElementById('loginModeLabel');
      if (mode === 'receive') {
        label.textContent = '📥 Receive';
        label.className = 'mode-label receive';
      } else {
        label.textContent = '📍 Dropzone';
        label.className = 'mode-label dropzone';
      }
      showScreen('loginScreen');
      badgeInput.value = '';
      loginError.textContent = '';
      smartFocus(badgeInput);
    }

    function goHome() {
      currentUser = '';
      currentUserDisplay = '';
      currentPallet = '';
      currentTrailer = '';
      scanCount = 0;
      scanStep = 'pallet';
      logEl.innerHTML = '';
      scanCountEl.textContent = '0 scans';
      showScreen('homeScreen');
    }

    document.addEventListener('click', function(e) {
      if (e.target.closest('.logo-btn') || e.target.closest('.home-btn')) return;
      autoFocus();
    });
    document.addEventListener('touchstart', function(e) {
      if (e.target.closest('.logo-btn') || e.target.closest('.home-btn')) return;
      autoFocus();
    });
    setInterval(autoFocus, 2000);

    function autoFocus() {
      var loginScreen = document.getElementById('loginScreen');
      var trailerScreen = document.getElementById('trailerScreen');
      var scannerScreen = document.getElementById('scannerScreen');
      var target = null;

      if (loginScreen.classList.contains('active')) target = badgeInput;
      else if (trailerScreen.classList.contains('active')) target = trailerInput;
      else if (scannerScreen.classList.contains('active')) target = scanInput;

      if (target && document.activeElement !== target) {
        smartFocus(target);
      }
    }

    badgeInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        var badge = badgeInput.value.trim();
        badgeInput.value = '';
        if (!badge) return;

        if (!isValidBadge(badge)) {
          loginError.textContent = '❌ Badge must be numbers only';
          return;
        }

        loginError.textContent = '';
        currentUser = badge;
        currentUserDisplay = lookupAlias(badge);
        document.getElementById('userName').textContent = currentUserDisplay;

        if (currentMode === 'receive') {
          showScreen('trailerScreen');
          trailerInput.value = '';
          trailerError.textContent = '';
          smartFocus(trailerInput);
        } else {
          enterScanner();
        }
      }
    });

    trailerInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        var trailer = trailerInput.value.trim().toUpperCase();
        trailerInput.value = '';
        if (!trailer) return;

        if (trailer.length < 3) {
          trailerError.textContent = '❌ Invalid Transhipment ID';
          return;
        }

        trailerError.textContent = '';
        currentTrailer = trailer;
        enterScanner();
      }
    });

    function enterScanner() {
      scanCount = 0;
      logEl.innerHTML = '';
      scanCountEl.textContent = '0 scans';

      if (currentMode === 'receive') {
        document.getElementById('trailerDisplay').innerHTML =
          ' | Trailer: <span class="trailer-id">' + currentTrailer + '</span>';
        stepDropzone.style.display = 'none';
        setReceivePalletStep();
      } else {
        document.getElementById('trailerDisplay').innerHTML = '';
        stepDropzone.style.display = '';
        setPalletStep();
      }

      showScreen('scannerScreen');
      smartFocus(scanInput);
    }

    scanInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        var value = scanInput.value.trim().toUpperCase();
        scanInput.value = '';
        if (!value) return;

        if (currentMode === 'receive') {
          handleReceiveScan(value);
        } else {
          handleDropzoneScan(value);
        }
      }
    });

    function handleReceiveScan(value) {
      if (isDropzone(value)) {
        setStatus('❌ You are in Receive mode — just scan pallets', 'error');
        return;
      }
      if (!isValidPallet(value)) {
        setStatus('❌ Invalid pallet — must be at least 11 characters', 'error');
        return;
      }
      submitScan(value, 'RECEIVE');
    }

    function setReceivePalletStep() {
      scanStep = 'pallet';
      stepPallet.className = 'step active-receive';
      stepPallet.textContent = 'Scan Pallet';
      promptIcon.textContent = '📥';
      promptText.textContent = 'Scan a pallet to receive';
      promptDetail.textContent = 'Trailer: ' + currentTrailer;
      promptCaptured.textContent = '';
    }

    function handleDropzoneScan(value) {
      if (scanStep === 'pallet') {
        if (isDropzone(value)) {
          setStatus('❌ Scan a pallet first, not a dropzone', 'error');
          return;
        }
        if (!isValidPallet(value)) {
          setStatus('❌ Invalid pallet — must be at least 11 characters', 'error');
          return;
        }
        currentPallet = value;
        setDropzoneStep();

      } else if (scanStep === 'dropzone') {
        if (!isDropzone(value)) {
          setStatus('❌ Not a valid dropzone — scan LIFT, CHILLER, FREEZER or HRV', 'error');
          return;
        }
        submitScan(currentPallet, value);
        currentPallet = '';
        setPalletStep();
      }
    }

    function setPalletStep() {
      scanStep = 'pallet';
      stepPallet.className = 'step active';
      stepPallet.textContent = '1. Scan Pallet';
      stepDropzone.className = 'step';
      promptIcon.textContent = '📦';
      promptText.textContent = 'Scan a pallet';
      promptDetail.textContent = '';
      promptCaptured.textContent = '';
    }

    function setDropzoneStep() {
      scanStep = 'dropzone';
      stepPallet.className = 'step done';
      stepDropzone.className = 'step active';
      promptIcon.textContent = '📍';
      promptText.textContent = 'Now scan the dropzone';
      promptDetail.textContent = 'LIFT · CHILLER · FREEZER · HRV';
      promptCaptured.textContent = 'Pallet: ' + currentPallet;
    }

    function submitScan(palletId, dropzone) {
      scanCount++;
      scanCountEl.textContent = scanCount + ' scans';

      var now = new Date();
      var timestamp = now.getFullYear() + '/' +
        String(now.getMonth() + 1).padStart(2, '0') + '/' +
        String(now.getDate()).padStart(2, '0') + ' - ' +
        String(now.getHours()).padStart(2, '0') + ':' +
        String(now.getMinutes()).padStart(2, '0');

      var entry = {
        palletId: palletId,
        dropzone: dropzone,
        timestamp: timestamp,
        user: currentUser,
        trailerId: currentTrailer || ''
      };

      addLogEntry(entry, 'pending');
      setStatus('Sending: ' + palletId + ' → ' + dropzone, 'ready');

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(entry)
      })
      .then(function(r) {
        if (r.ok || r.status === 202) {
          updateLogEntry(palletId, timestamp, 'sent');
          setStatus('✓ ' + palletId + ' → ' + dropzone, 'success');
        } else {
          throw new Error('HTTP ' + r.status);
        }
      })
      .catch(function() {
        queueOffline(entry);
        updateLogEntry(palletId, timestamp, 'failed');
        setStatus('⚠ Queued offline: ' + palletId, 'offline');
      });

      if (currentMode === 'receive') {
        setReceivePalletStep();
      }
    }

    function queueOffline(entry) {
      var queue = JSON.parse(localStorage.getItem(OFFLINE_KEY) || '[]');
      queue.push(entry);
      localStorage.setItem(OFFLINE_KEY, JSON.stringify(queue));
    }

    function flushOffline() {
      var queue = JSON.parse(localStorage.getItem(OFFLINE_KEY) || '[]');
      if (queue.length === 0) return;

      var remaining = [];
      var sent = 0;

      queue.forEach(function(entry) {
        fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(entry)
        })
        .then(function(r) {
          if (r.ok || r.status === 202) { sent++; }
          else { remaining.push(entry); }
        })
        .catch(function() {
          remaining.push(entry);
        })
        .finally(function() {
          if (sent + remaining.length === queue.length) {
            localStorage.setItem(OFFLINE_KEY, JSON.stringify(remaining));
            if (sent > 0) setStatus('✓ Synced ' + sent + ' offline scans', 'success');
          }
        });
      });
    }

    setInterval(flushOffline, 30000);

    function setStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = 'status ' + type;
    }

    function addLogEntry(entry, state) {
      var div = document.createElement('div');
      div.className = 'log-entry ' + state;
      div.dataset.palletId = entry.palletId;
      div.dataset.time = entry.timestamp;
      div.innerHTML =
        '<span class="barcode">' + entry.palletId + '</span>' +
        '<span>' + entry.dropzone + '</span>' +
        '<span class="time">' + entry.timestamp.split(' - ')[1] + '</span>';
      logEl.insertBefore(div, logEl.firstChild);
      while (logEl.children.length > 50) logEl.removeChild(logEl.lastChild);
    }

    function updateLogEntry(palletId, timestamp, state) {
      var entries = logEl.querySelectorAll('.log-entry');
      for (var i = 0; i < entries.length; i++) {
        if (entries[i].dataset.palletId === palletId && entries[i].dataset.time === timestamp) {
          entries[i].className = 'log-entry ' + state;
          break;
        }
      }
    }

    window.addEventListener('online', function() {
      setStatus('Back online — syncing...', 'success');
      flushOffline();
    });

    window.addEventListener('offline', function() {
      setStatus('⚠ Offline — scans will be queued', 'offline');
    });
  </script>
</body>
</html>
